[package]
name = "optionfiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "optionFiles — minimal terminal file manager"
authors.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["files", "file-manager", "terminal", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "optionfiles"
path = "src/main.rs"

[[bin]]
name = "fls"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "color"] }
crossterm = "0.28"
libc = "0.2"
parking_lot = "0.12"
optionSDK = { workspace = true }
optionfiles-core = { path = "../optionfiles-core" }
unicode-width = "0.2"
